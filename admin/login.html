<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول الإدارة | مؤسسة الغنيمي</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../img/logo.png">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .admin-login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 16px; background: var(--bg-primary); }
    .admin-card { width:100%; max-width:440px; background: var(--bg-card); border:1px solid var(--border-color); border-radius: var(--radius-lg); padding:32px 24px; box-shadow: var(--shadow-card); }
    .admin-card h1 { font-size:1.4rem; font-weight:900; margin-bottom:6px; text-align:center; }
    .admin-card .sub { color:var(--text-secondary); font-size:0.9rem; text-align:center; margin-bottom:20px; }
    .admin-card .form-group { margin-bottom:14px; }
    .admin-card .error { display:none; background: rgba(220,38,38,0.08); border:1px solid rgba(220,38,38,0.2); color:#f87171; padding:10px 12px; border-radius:8px; font-size:0.85rem; margin-bottom:12px; }
    .admin-card .success { display:none; background: rgba(34,197,94,0.08); border:1px solid rgba(34,197,94,0.2); color:#4ade80; padding:10px 12px; border-radius:8px; font-size:0.85rem; margin-bottom:12px; }
  </style>
</head>
<body>
  <div class="admin-login-wrap">
    <div class="admin-card">
      <h1>تسجيل دخول الإدارة</h1>
      <p class="sub">مؤسسة الغنيمي للمحاماة — وصول الإدارة فقط</p>
      <div id="error" class="error"></div>
      <div id="success" class="success"></div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input id="email" type="email" class="form-control" required autocomplete="username" placeholder="admin@al-ghunaimi.com" dir="ltr">
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input id="password" type="password" class="form-control" required autocomplete="current-password" placeholder="••••••••" dir="ltr">
        </div>
        <button type="submit" class="btn-gold btn-full" id="login-btn">دخول</button>
      </form>
      <p style="text-align:center; margin-top:14px; font-size:0.85rem;">
        <a href="#" id="forgot-link" style="color:var(--accent-gold); text-decoration:none;">نسيت كلمة المرور؟</a>
      </p>
      <p id="config-warn" style="display:none; text-align:center; margin-top:12px; font-size:0.8rem; color:var(--text-muted);">Supabase غير مُهيأ. راجع <code>js/supabase-config.js</code> و <code>SUPABASE_SETUP.md</code></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase.js"></script>
  <script>
    const supabaseClient = window.GhonemySupabase.createClient();
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    const configWarn = document.getElementById('config-warn');
    if (!supabaseClient) configWarn.style.display = 'block';

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
      successEl.style.display = 'none';
    }
    function showSuccess(msg) {
      successEl.textContent = msg;
      successEl.style.display = 'block';
      errorEl.style.display = 'none';
    }

    // If already logged in and is admin, redirect
    (async () => {
      if (!supabaseClient) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        // check admin
        const { data: admin } = await supabaseClient.from('admin_users').select('role').eq('user_id', session.user.id).maybeSingle();
        if (admin) location.href = 'articles.html';
      }
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return showError('أدخل البريد وكلمة المرور');
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'جاري الدخول...';
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        // verify admin
        const { data: admin, error: adminErr } = await supabaseClient.from('admin_users').select('role').eq('user_id', data.user.id).maybeSingle();
        if (adminErr) throw adminErr;
        if (!admin) {
          await supabaseClient.auth.signOut();
          throw new Error('هذا الحساب ليس مسؤولاً. تواصل مع الإدارة.');
        }
        location.href = 'articles.html';
      } catch (err) {
        showError(err.message || 'فشل تسجيل الدخول');
      } finally {
        btn.disabled = false;
        btn.textContent = 'دخول';
      }
    });

    document.getElementById('forgot-link').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return showError('أدخل بريدك أولاً لإرسال رابط الاستعادة');
      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + window.location.pathname.replace('login.html','') + 'login.html'
        });
        if (error) throw error;
        showSuccess('تم إرسال رابط استعادة كلمة المرور إلى بريدك');
      } catch (err) {
        showError(err.message);
      }
    });

    if (supabaseClient) supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') {
        // stay on login
      }
    });
  </script>
</body>
</html>
