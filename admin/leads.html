<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الطلبات | مؤسسة الغنيمي</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../img/logo.png">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .admin-wrap{max-width:1000px;margin:0 auto;padding:100px 16px 40px}
    table{width:100%;border-collapse:collapse;background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;overflow:hidden}
    th,td{padding:10px 12px;text-align:right;font-size:0.85rem;border-bottom:1px solid var(--border-color)}
    th{background:var(--bg-secondary);font-weight:800}
    .badge{padding:3px 8px;border-radius:20px;font-size:0.7rem;font-weight:800}
    .badge.new{background:rgba(59,130,246,0.15);color:#60a5fa}
  </style>
</head>
<body>
  <div class="admin-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h1>الطلبات (Lead Attribution)</h1>
      <div style="display:flex;gap:8px;">
        <a href="articles.html" class="btn-outline">المقالات</a>
        <button id="logout" class="btn-outline">خروج</button>
      </div>
    </div>
    <div id="health" style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;"></div>
    <div id="error" style="display:none;background:rgba(220,38,38,0.08);border:1px solid rgba(220,38,38,0.2);color:#f87171;padding:10px;border-radius:8px;margin-bottom:12px;"></div>
    <div style="overflow:auto;">
      <table id="leads-table">
        <thead><tr><th>Lead ID</th><th>التاريخ</th><th>المصدر</th><th>الصفحة</th><th>النوع</th><th>الحالة</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:20px;">جاري التحميل...</td></tr></tbody>
      </table>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase.js"></script>
  <script>
    const supabase = window.GhonemySupabase.createClient();
    async function requireAdmin(){
      const { data:{session} } = await supabase.auth.getSession();
      if(!session){ location.href='login.html'; return null; }
      const { data:admin } = await supabase.from('admin_users').select('role').eq('user_id', session.user.id).maybeSingle();
      if(!admin){ await supabase.auth.signOut(); location.href='login.html'; return null; }
      return session;
    }
    async function load(){
      const session = await requireAdmin();
      if(!session) return;
      // health
      const healthEl = document.getElementById('health');
      healthEl.innerHTML = '<span style="padding:6px 10px;background:rgba(34,197,94,0.1);border-radius:20px;font-size:0.8rem;">Supabase: CONNECTED</span> <span style="padding:6px 10px;background:rgba(34,197,94,0.1);border-radius:20px;font-size:0.8rem;">Lead: ...</span>';
      try{
        const res = await fetch('/api/leads', { headers: { Authorization: `Bearer ${session.access_token}` } });
        const j = await res.json();
        if(!res.ok) throw new Error(j.error || 'Failed');
        document.querySelector('#health span:last-child').textContent = 'Lead: ONLINE';
        document.querySelector('#health span:last-child').style.background='rgba(34,197,94,0.1)';
        const tbody = document.getElementById('tbody');
        if(!j.leads || !j.leads.length){ tbody.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:20px;">لا توجد طلبات بعد</td></tr>'; return; }
        tbody.innerHTML = j.leads.map(l=> `<tr><td style="font-family:monospace;font-weight:800;">${l.lead_id||''}</td><td>${l.created_at? new Date(l.created_at).toLocaleString('ar-EG'):''}</td><td>${l.source||''}</td><td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${l.landing_path||''}</td><td>${l.conversion_type||''}</td><td><span class="badge new">${l.status||'new'}</span></td></tr>`).join('');
      }catch(e){
        document.getElementById('error').textContent = e.message;
        document.getElementById('error').style.display='block';
        document.getElementById('tbody').innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">خطأ في التحميل</td></tr>';
        const h = document.querySelector('#health span:last-child');
        if(h){ h.textContent='Lead: DEGRADED'; h.style.background='rgba(239,68,68,0.1)'; }
      }
    }
    document.getElementById('logout').addEventListener('click', async()=>{ await supabase.auth.signOut(); location.href='login.html'; });
    load();
  </script>
</body>
</html>
