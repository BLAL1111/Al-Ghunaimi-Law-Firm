<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#goldGradient)" stroke-width="3"/>
  <!-- Scale of Justice -->
  <g transform="translate(50,50)">
    <!-- Central Pillar -->
    <rect x="-3" y="-25" width="6" height="40" fill="url(#goldGradient)" rx="2"/>
    <!-- Top Beam -->
    <rect x="-25" y="-28" width="50" height="4" fill="url(#goldGradient)" rx="2"/>
    <!-- Left Pan -->
    <path d="M-25,-24 L-25,-15 Q-25,-10 -20,-10 L-15,-10 Q-10,-10 -10,-15 L-10,-24" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right Pan -->
    <path d="M25,-24 L25,-15 Q25,-10 20,-10 L15,-10 Q10,-10 10,-15 L10,-24" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Chains Left -->
    <line x1="-25" y1="-24" x2="-20" y2="-15" stroke="url(#goldGradient)" stroke-width="2"/>
    <line x1="-10" y1="-24" x2="-15" y2="-15" stroke="url(#goldGradient)" stroke-width="2"/>
    <!-- Chains Right -->
    <line x1="25" y1="-24" x2="20" y2="-15" stroke="url(#goldGradient)" stroke-width="2"/>
    <line x1="10" y1="-24" x2="15" y2="-15" stroke="url(#goldGradient)" stroke-width="2"/>
    <!-- Base -->
    <rect x="-15" y="15" width="30" height="5" fill="url(#goldGradient)" rx="2"/>
    <rect x="-20" y="20" width="40" height="4" fill="url(#goldGradient)" rx="2"/>
  </g>
</svg>